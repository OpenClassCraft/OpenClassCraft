name: whitespace_checks

# Check whitespaces of the following file types
# Not checked: .lua, .yml, .properties, .conf, .java, .py, .svg, .gradle, .xml, ...
# (luacheck already checks .lua files)
on:
  push:
    branches: [Latest, main]
    paths:
      - '**.txt'
      - '**.md'
      - '**.[ch]'
      - '**.cpp'
      - '**.hpp'
      - '**.sh'
      - '**.cmake'
      - '**.glsl'
      - '**.lua'
  pull_request:
    paths:
      - '**.txt'
      - '**.md'
      - '**.[ch]'
      - '**.cpp'
      - '**.hpp'
      - '**.sh'
      - '**.cmake'
      - '**.glsl'
      - '**.lua'

jobs:
  trailing_whitespaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Line endings are already ensured by .gitattributes
      - name: Check trailing whitespaces
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA" --

  indent_spaces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Line endings are already ensured by .gitattributes
      # Keep new C++ and Lua indentation tab-based without making old style
      # debt in otherwise untouched lines block an unrelated pull request.
      - name: Check indentation added by this change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mapfile -t cpp_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- |
              sed -nE '/^src\/.*\.cpp$|^src\/.*\.[ch]$/p'
          )
          mapfile -t lua_files < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- |
              sed -nE '/\.lua$/p'
          )
          files=("${cpp_files[@]}" "${lua_files[@]}")
          if (( ${#files[@]} > 0 )) &&
              git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" -- "${files[@]}" |
                grep -n -P '^\+\t* (?!\*)'; then
            printf '\033[0;31mFound incorrect indent whitespace\033[0m\n'
            exit 1
          fi

  tabs_lua_api_files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Some files should not contain tabs
      - name: Check tabs in Lua API files
        run: |
          if grep -n $'\t' doc/lua_api.md doc/client_lua_api.md;\
          then\
            echo -e "\033[0;31mFound tab in markdown file";\
            (exit 1);\
          else\
            (exit 0);\
          fi
