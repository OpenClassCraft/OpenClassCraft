name: lua_lint

# Lint on Lua changes in the engine or bundled educational game.
on:
  push:
    branches: [Latest, main]
    paths:
      - 'builtin/**.lua'
      - 'games/devtest/**.lua'
      - 'games/luanti_edu/**.lua'
      - 'util/ci/**'
      - '.github/workflows/lua.yml'
  pull_request:
    paths:
      - 'builtin/**.lua'
      - 'games/devtest/**.lua'
      - 'games/luanti_edu/**.lua'
      - 'util/ci/**'
      - '.github/workflows/lua.yml'

jobs:
  # Note that the integration tests are also run in build.yml, but only when C++ code is changed.
  integration_tests:
    name: "Compile and run multiplayer tests"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Install deps
      run: |
        source ./util/ci/common.sh
        install_linux_deps clang gdb libluajit-5.1-dev xvfb

    - name: Build
      run: |
        ./util/ci/build.sh
      env:
        CC: clang
        CXX: clang++
        CMAKE_FLAGS: "-DENABLE_GETTEXT=0 -DBUILD_SERVER=0 -DBUILD_UNITTESTS=0"

    - name: Integration test + devtest
      run: |
        serverconf="profiler.load=true" ./util/test_multiplayer.sh

    - name: Singleplayer test (legacy GL)
      run: |
        clientconf="video_driver=opengl" xvfb-run ./util/test_singleplayer.sh

  luacheck:
    name: "Builtin Luacheck and Unit Tests"
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v7
    - uses: leafo/gh-actions-lua@v13
      with:
        luaVersion: "5.1.5"
    - uses: leafo/gh-actions-luarocks@v6

    - name: Install LuaJIT
      run: ./util/ci/build_luajit.sh

    - name: Install luarocks tools
      run: |
        luarocks install --local luacheck
        luarocks install --local busted

    - name: Run checks (builtin)
      run: |
        "$HOME/.luarocks/bin/luacheck" builtin
        "$HOME/.luarocks/bin/busted" builtin
        "$HOME/.luarocks/bin/busted" builtin --lua="$HOME/LuaJIT/src/luajit"

    - name: Run checks (devtest)
      run: |
        "$HOME/.luarocks/bin/luacheck" --config=games/devtest/.luacheckrc games/devtest

    - name: Syntax-check the bundled OpenClassCraft game
      run: |
        while IFS= read -r -d '' file; do
          OCC_LUA_FILE="$file" lua -e 'assert(loadfile(os.getenv("OCC_LUA_FILE")))'
        done < <(find games/luanti_edu -type f -name '*.lua' -print0)
