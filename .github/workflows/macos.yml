name: macos

# build on c/cpp changes or workflow changes
on:
  push:
    branches: [Latest, main]
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - 'irr/**.mm' # Objective-C(++)
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'util/ci/**'
      - '.github/workflows/macos.yml'
  pull_request:
    paths:
      - 'lib/**.[ch]'
      - 'lib/**.cpp'
      - 'src/**.[ch]'
      - 'src/**.cpp'
      - 'irr/**.[ch]'
      - 'irr/**.cpp'
      - 'irr/**.mm' # Objective-C(++)
      - '**/CMakeLists.txt'
      - 'cmake/Modules/**'
      - 'po/**.po'
      - 'util/ci/**'
      - '.github/workflows/macos.yml'

jobs:
  build-older-macos:
    strategy:
      matrix:
        osver: [11.3]
        xcodever: [16.2]
        arch: ["x86_64"]
        build_type: ["Debug"]
        xcode: ["no"]
        include:
          - osver: 11.3
            xcodever: 16.2
            arch: "x86_64"
            build_type: "Debug"
            xcode: "no"
          - osver: 11.3
            xcodever: 16.2
            arch: "arm64"
            build_type: "Release"
            xcode: "yes"
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Prepare environment
        run: |
          {
            echo "REPDIR=$(pwd)"
            echo "osver=${{matrix.osver}}"
            echo "xcodever=${{matrix.xcodever}}"
            echo "arch=${{matrix.arch}}"
            echo "build_type=${{matrix.build_type}}"
          } >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          mkdir downloads
          source ./util/ci/common.sh
          source ./util/ci/macos_sdk.sh
          install_macos_precompiled_deps "$osver" "$arch"
          install_macos_sdk "$osver" "$xcodever" downloads

      - name: Build with GNU Make
        run: |
          mkdir build
          cd build
          export DEPS_DIR=/Users/Shared/macos${osver}_${arch}_deps
          export USE_XCODE=no
          ../util/ci/build_macos.sh

      - name: Build and Archive with Xcode
        if: ${{matrix.xcode == 'yes'}}
        run: |
          mkdir build_xcode
          cd build_xcode
          export DEPS_DIR=/Users/Shared/macos${osver}_${arch}_deps
          export USE_XCODE=yes
          ../util/ci/build_macos.sh

      - name: Test GNU Make build
        run: |
          mkdir -p "${HOME}/Library/Application Support/minetest/games/"
          ln -s "${PWD}/games/devtest" "${HOME}/Library/Application Support/minetest/games/"
          ./build/macos/openclasscraft.app/Contents/MacOS/openclasscraft --run-unittests

      - name: Test XCode build
        if: ${{matrix.xcode == 'yes'}}
        run: |
          "./build_xcode/build/${build_type}/openclasscraft.app/Contents/MacOS/openclasscraft" --run-unittests
          ./build_xcode/openclasscraft.xcarchive/Products/Applications/openclasscraft.app/Contents/MacOS/openclasscraft --run-unittests

      - name: Diff Resources
        if: ${{matrix.xcode == 'yes'}}
        run: |
          diff -rd ./build/macos/openclasscraft.app/Contents/Resources "./build_xcode/build/${build_type}/openclasscraft.app/Contents/Resources" || exit 1
          diff -rd ./build/macos/openclasscraft.app/Contents/Resources ./build_xcode/openclasscraft.xcarchive/Products/Applications/openclasscraft.app/Contents/Resources || exit 1
      # Zipping the built .app preserves permissions on the contained files,
      #   which the GitHub artifact pipeline would otherwise strip away.
      - name: CPack
        run: |
          cd build
          rm -rf macos
          cpack -G ZIP -B macos
          set -- macos/*.zip
          mv "$1" "${1%.zip}${osver}-${arch}.zip"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          archive: false
          path: ./build/macos/*.zip
