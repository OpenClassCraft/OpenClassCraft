name: release-build

on:
  push:
    branches: [Latest, main]
    paths:
      - '.github/workflows/release-build.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'irr/**'
      - 'lib/**'
      - 'builtin/**'
      - 'client/**'
      - 'creator-app/**'
      - 'doc/**'
      - 'fonts/**'
      - 'games/luanti_edu/**'
      - 'misc/**'
      - 'po/**'
      - 'textures/**'
      - 'teacher-console/**'
      - 'util/**'
      - 'vcpkg.json'
      - 'README.md'
      - 'LICENSE.txt'
      - 'COPYING.LESSER'
  pull_request:
    paths:
      - '.github/workflows/release-build.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'irr/**'
      - 'lib/**'
      - 'builtin/**'
      - 'client/**'
      - 'creator-app/**'
      - 'doc/**'
      - 'fonts/**'
      - 'games/luanti_edu/**'
      - 'misc/**'
      - 'po/**'
      - 'textures/**'
      - 'teacher-console/**'
      - 'util/**'
      - 'vcpkg.json'
      - 'README.md'
      - 'LICENSE.txt'
      - 'COPYING.LESSER'
  workflow_dispatch:
    inputs:
      build_ref:
        description: Branch, commit, or existing tag to build
        required: true
        default: Latest
        type: string
      publish:
        description: Publish validated Community Edition assets as a GitHub Release
        required: true
        default: false
        type: boolean
      build_school_console:
        description: Build controlled School Console packages for an owner-authorised pilot
        required: true
        default: false
        type: boolean
      release_scope:
        description: Community platforms allowed in a public release
        required: true
        default: fedora-alpha
        type: choice
        options:
          - fedora-alpha
          - all-community
      tag:
        description: Existing tag to release (required when publish is enabled)
        required: false
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  ubuntu:
    name: Ubuntu 24.04 portable TGZ
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_scope == 'all-community' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ref || github.sha }}
          persist-credentials: false

      - name: Install build and metadata tools
        run: |
          source ./util/ci/common.sh
          install_linux_deps g++-14 libluajit-5.1-dev ninja-build appstream desktop-file-utils

      - name: Validate Linux integration metadata
        run: |
          desktop-file-validate misc/org.openclasscraft.OpenClassCraft.desktop
          appstreamcli validate --no-net misc/org.openclasscraft.OpenClassCraft.metainfo.xml

      - name: Configure
        env:
          CC: gcc-14
          CXX: g++-14
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRUN_IN_PLACE=TRUE \
            -DBUILD_CLIENT=TRUE \
            -DBUILD_SERVER=FALSE \
            -DBUILD_UNITTESTS=TRUE \
            -DBUILD_DOCUMENTATION=FALSE \
            -DENABLE_GETTEXT=TRUE \
            -DENABLE_POSTGRESQL=OFF \
            -DENABLE_REDIS=OFF \
            -DENABLE_LEVELDB=OFF \
            -DENABLE_SPATIAL=OFF \
            -DENABLE_UPDATE_CHECKER=FALSE \
            -DENABLE_LTO=FALSE

      - name: Build and test
        run: |
          cmake --build build --parallel "$(nproc)"
          ./bin/openclasscraft --version
          ./bin/openclasscraft --run-unittests

      - name: Package
        run: |
          cpack --config build/CPackConfig.cmake -G TGZ -B Package
          mapfile -t packages < <(find Package -maxdepth 1 -type f -name '*.tar.gz')
          if (( ${#packages[@]} != 1 )); then
            printf 'Expected one TGZ package, found %s\n' "${#packages[@]}" >&2
            exit 1
          fi
          mkdir -p artifact
          cp "${packages[0]}" artifact/OpenClassCraft-Ubuntu-24.04-x86_64.tar.gz
          (
            cd artifact
            sha256sum OpenClassCraft-Ubuntu-24.04-x86_64.tar.gz \
              > OpenClassCraft-Ubuntu-24.04-x86_64.tar.gz.sha256
          )

      - name: Validate packaged content and runtime
        run: |
          mkdir package-check
          tar -xzf artifact/OpenClassCraft-Ubuntu-24.04-x86_64.tar.gz -C package-check
          binary="$(find package-check -type f -path '*/bin/openclasscraft' -print -quit)"
          test -n "$binary"
          package_root="${binary%/bin/openclasscraft}"
          test -f "$package_root/builtin/init.lua"
          test -f "$package_root/games/luanti_edu/game.conf"
          test -f "$package_root/games/luanti_edu/mods/openclasscraft_classroom/init.lua"
          test -f "$package_root/doc/README.md"
          test -f "$package_root/doc/LICENSE.txt"
          test -f "$package_root/doc/COPYING.LESSER"
          test -f "$package_root/unix/man/man6/openclasscraft.6"
          test -f "$package_root/locale/de/LC_MESSAGES/openclasscraft.mo"
          (
            cd "$package_root"
            ./bin/openclasscraft --version
            ./bin/openclasscraft --run-unittests
            smoke_world="$(mktemp -d)"
            smoke_log="$(mktemp)"
            timeout --preserve-status --signal=INT 8 ./bin/openclasscraft \
              --server --world "$smoke_world" --gameid luanti_edu \
              --config /dev/null --port 31099 --logfile "$smoke_log"
            grep -F '[luanti_coding] Loaded!' "$smoke_log"
            grep -F 'Server for gameid="luanti_edu" listening' "$smoke_log"
            if grep -F 'ERROR[' "$smoke_log"; then
              echo 'Fresh OpenClassCraft world logged an error.' >&2
              exit 1
            fi
          )

      - uses: actions/upload-artifact@v7
        with:
          name: OpenClassCraft-Ubuntu-24.04-x86_64
          path: |
            artifact/OpenClassCraft-Ubuntu-24.04-x86_64.tar.gz
            artifact/OpenClassCraft-Ubuntu-24.04-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  fedora:
    name: Fedora 44 RPM
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Install build and packaging tools
        run: |
          dnf install -y \
            appstream cmake desktop-file-utils file findutils freetype-devel \
            gcc-c++ gettext git gmp-devel jsoncpp-devel libcurl-devel \
            libjpeg-turbo-devel libogg-devel libpng-devel libvorbis-devel \
            libzstd-devel luajit-devel make mesa-libGL-devel ncurses-devel \
            ninja-build openal-soft-devel openssl-devel rpm-build \
            sdl2-compat-devel sqlite-devel tar which zlib-ng-compat-devel

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ref || github.sha }}
          persist-credentials: false

      - name: Validate Linux integration metadata
        run: |
          desktop-file-validate misc/org.openclasscraft.OpenClassCraft.desktop
          appstreamcli validate --no-net misc/org.openclasscraft.OpenClassCraft.metainfo.xml

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DRUN_IN_PLACE=FALSE \
            -DBUILD_CLIENT=TRUE \
            -DBUILD_SERVER=FALSE \
            -DBUILD_UNITTESTS=TRUE \
            -DBUILD_DOCUMENTATION=FALSE \
            -DENABLE_GETTEXT=TRUE \
            -DENABLE_POSTGRESQL=OFF \
            -DENABLE_REDIS=OFF \
            -DENABLE_LEVELDB=OFF \
            -DENABLE_SPATIAL=OFF \
            -DENABLE_UPDATE_CHECKER=FALSE \
            -DENABLE_LTO=FALSE

      - name: Build and test
        run: |
          cmake --build build --parallel "$(nproc)"
          ./bin/openclasscraft --version
          ./bin/openclasscraft --run-unittests

      - name: Package RPM
        run: |
          cpack --config build/CPackConfig.cmake -G RPM -B Package
          mapfile -t packages < <(find Package -maxdepth 1 -type f -name '*.rpm')
          if (( ${#packages[@]} != 1 )); then
            printf 'Expected one RPM package, found %s\n' "${#packages[@]}" >&2
            exit 1
          fi
          mkdir -p artifact
          cp "${packages[0]}" artifact/OpenClassCraft-Fedora-44-x86_64.rpm
          (
            cd artifact
            sha256sum OpenClassCraft-Fedora-44-x86_64.rpm \
              > OpenClassCraft-Fedora-44-x86_64.rpm.sha256
          )

      - name: Validate and install RPM
        run: |
          asset=artifact/OpenClassCraft-Fedora-44-x86_64.rpm
          rpm -qpl "$asset" | grep -Fx /usr/bin/openclasscraft
          rpm -qpl "$asset" | grep -Fx /usr/share/openclasscraft/games/luanti_edu/game.conf
          rpm -qpl "$asset" | grep -Fx /usr/share/applications/org.openclasscraft.OpenClassCraft.desktop
          rpm -qpl "$asset" | grep -Fx /usr/share/metainfo/org.openclasscraft.OpenClassCraft.metainfo.xml
          rpm -qpl "$asset" | grep -Fx /usr/share/icons/hicolor/1024x1024/apps/openclasscraft.png
          rpm -qpl "$asset" | grep -Fx /usr/share/doc/openclasscraft/README.md
          rpm -qpl "$asset" | grep -Fx /usr/share/doc/openclasscraft/LICENSE.txt
          rpm -qpl "$asset" | grep -Fx /usr/share/doc/openclasscraft/COPYING.LESSER
          rpm -qpl "$asset" | grep -Fx /usr/share/man/man6/openclasscraft.6
          rpm -qpl "$asset" | grep -Fx /usr/share/locale/de/LC_MESSAGES/openclasscraft.mo
          test -z "$(rpm -qp --configfiles "$asset")"
          dnf install -y "$asset"
          openclasscraft --version
          openclasscraft --run-unittests
          smoke_world="$(mktemp -d)"
          smoke_log="$(mktemp)"
          timeout --preserve-status --signal=INT 8 openclasscraft \
            --server --world "$smoke_world" --gameid luanti_edu \
            --config /dev/null --port 31099 --logfile "$smoke_log"
          grep -F '[luanti_coding] Loaded!' "$smoke_log"
          grep -F 'Server for gameid="luanti_edu" listening' "$smoke_log"
          if grep -F 'ERROR[' "$smoke_log"; then
            echo 'Fresh OpenClassCraft world logged an error.' >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: OpenClassCraft-Fedora-44-x86_64
          path: |
            artifact/OpenClassCraft-Fedora-44-x86_64.rpm
            artifact/OpenClassCraft-Fedora-44-x86_64.rpm.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows x64 portable ZIP
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_scope == 'all-community' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ref || github.sha }}
          persist-credentials: false

      - name: Restore cache and install vcpkg dependencies
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: '${{ github.workspace }}\vcpkg'

      - name: Configure
        run: |
          cmake -S . -B build -G "Visual Studio 18 2026" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DRUN_IN_PLACE=TRUE `
            -DBUILD_CLIENT=TRUE `
            -DBUILD_SERVER=FALSE `
            -DBUILD_UNITTESTS=TRUE `
            -DBUILD_DOCUMENTATION=FALSE `
            -DENABLE_GETTEXT=TRUE `
            -DENABLE_POSTGRESQL=OFF `
            -DENABLE_REDIS=OFF `
            -DENABLE_LEVELDB=OFF `
            -DENABLE_SPATIAL=OFF `
            -DENABLE_UPDATE_CHECKER=FALSE `
            -DENABLE_LTO=FALSE

      - name: Build and test
        run: |
          cmake --build build --config Release --parallel
          $process = Start-Process .\bin\Release\openclasscraft.exe `
            -ArgumentList "--version" -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Version check failed with exit code $($process.ExitCode)" }
          $process = Start-Process .\bin\Release\openclasscraft.exe `
            -ArgumentList "--run-unittests" -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Unit tests failed with exit code $($process.ExitCode)" }

      - name: Package
        run: |
          cpack --config build\CPackConfig.cmake -C Release -G ZIP -B Package
          $packages = @(Get-ChildItem Package -Filter *.zip -File)
          if ($packages.Count -ne 1) { throw "Expected one ZIP package, found $($packages.Count)" }
          New-Item -ItemType Directory -Force artifact | Out-Null
          $assetName = "OpenClassCraft-Windows-x64.zip"
          Copy-Item $packages[0].FullName "artifact\$assetName"
          $hash = (Get-FileHash "artifact\$assetName" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii "artifact\$assetName.sha256" "$hash  $assetName"

      - name: Validate packaged content and runtime
        run: |
          Expand-Archive artifact\OpenClassCraft-Windows-x64.zip package-check
          $binary = Get-ChildItem package-check -Recurse -Filter openclasscraft.exe -File |
            Where-Object { $_.Directory.Name -eq "bin" } | Select-Object -First 1
          if (-not $binary) { throw "Packaged openclasscraft.exe was not found" }
          $packageRoot = Split-Path $binary.Directory.FullName -Parent
          $required = @(
            "builtin\init.lua",
            "games\luanti_edu\game.conf",
            "games\luanti_edu\mods\openclasscraft_classroom\init.lua",
            "doc\README.md",
            "doc\LICENSE.txt",
            "doc\COPYING.LESSER",
            "locale\de\LC_MESSAGES\openclasscraft.mo"
          )
          foreach ($path in $required) {
            if (-not (Test-Path (Join-Path $packageRoot $path))) { throw "Missing package content: $path" }
          }
          $process = Start-Process $binary.FullName -ArgumentList "--version" `
            -WorkingDirectory $packageRoot -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged version check failed with exit code $($process.ExitCode)" }
          $process = Start-Process $binary.FullName -ArgumentList "--run-unittests" `
            -WorkingDirectory $packageRoot -NoNewWindow -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged unit tests failed with exit code $($process.ExitCode)" }

          $smokeWorld = Join-Path $env:RUNNER_TEMP "openclasscraft-smoke-world"
          $smokeConfig = Join-Path $env:RUNNER_TEMP "openclasscraft-smoke.conf"
          $smokeLog = Join-Path $env:RUNNER_TEMP "openclasscraft-smoke.log"
          New-Item -ItemType Directory -Force $smokeWorld | Out-Null
          New-Item -ItemType File -Force $smokeConfig | Out-Null
          $smoke = Start-Process $binary.FullName -WorkingDirectory $packageRoot -PassThru `
            -ArgumentList @("--server", "--world", $smokeWorld, "--gameid", "luanti_edu", `
              "--config", $smokeConfig, "--port", "31099", "--logfile", $smokeLog)
          Start-Sleep -Seconds 8
          if ($smoke.HasExited) { throw "Fresh-world smoke test exited early with code $($smoke.ExitCode)" }
          Stop-Process -Id $smoke.Id
          Wait-Process -Id $smoke.Id -ErrorAction SilentlyContinue
          $smokeOutput = Get-Content $smokeLog -Raw
          if ($smokeOutput -notmatch '\[luanti_coding\] Loaded!') { throw "Coding mod did not load" }
          if ($smokeOutput -notmatch 'Server for gameid="luanti_edu" listening') { throw "Game server did not start" }
          if ($smokeOutput -match 'ERROR\[') { throw "Fresh OpenClassCraft world logged an error" }

      - uses: actions/upload-artifact@v7
        with:
          name: OpenClassCraft-Windows-x64
          path: |
            artifact\OpenClassCraft-Windows-x64.zip
            artifact\OpenClassCraft-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  desktop-linux:
    name: Creator preview and School Console checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            creator-app/package-lock.json
            teacher-console/package-lock.json

      - name: Install, syntax-check, and package Creator preview
        run: |
          cd creator-app
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          node --check main.js
          node --check preload.js
          node --check app/renderer.js
          npm run package:linux

      - name: Install and syntax-check School Console
        run: |
          cd teacher-console
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          node --check main.js
          node --check preload.js
          node --check app/renderer.js

      - name: Package controlled School Console
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_school_console }}
        run: |
          cd teacher-console
          npm run package:linux

      - name: Validate and checksum Creator AppImage
        run: |
          mapfile -t creator_assets < <(find creator-app/dist -maxdepth 1 -type f \
            -name 'OpenClassCraft-Creator-*-linux-x86_64.AppImage' | sort)
          if (( ${#creator_assets[@]} != 1 )); then
            printf 'Expected one Creator AppImage; found %s\n' "${#creator_assets[@]}" >&2
            exit 1
          fi
          mkdir -p creator-artifact
          cp "${creator_assets[0]}" creator-artifact/
          (
            cd creator-artifact
            asset="$(find . -maxdepth 1 -type f -name '*.AppImage' -printf '%f\n')"
            sha256sum "$asset" > "$asset.sha256"
          )

      - name: Validate and checksum controlled School Console AppImage
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_school_console }}
        run: |
          mapfile -t teacher_assets < <(find teacher-console/dist -maxdepth 1 -type f \
            -name 'OpenClassCraft-Teacher-Console-*-linux-x86_64.AppImage' | sort)
          if (( ${#teacher_assets[@]} != 1 )); then
            printf 'Expected one School Console AppImage; found %s\n' "${#teacher_assets[@]}" >&2
            exit 1
          fi
          mkdir -p school-console-artifact
          cp "${teacher_assets[0]}" school-console-artifact/
          (
            cd school-console-artifact
            asset="$(find . -maxdepth 1 -type f -name '*.AppImage' -printf '%f\n')"
            sha256sum "$asset" > "$asset.sha256"
          )

      - name: Upload Creator preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenClassCraft-Creator-Preview-Linux-x86_64
          path: creator-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload controlled School Console artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_school_console }}
        uses: actions/upload-artifact@v7
        with:
          name: OpenClassCraft-School-Console-Internal-Linux-x86_64
          path: school-console-artifact/
          if-no-files-found: error
          retention-days: 7

  desktop-windows:
    name: Creator preview and School Console checks (Windows)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_scope == 'all-community' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.build_ref || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            creator-app/package-lock.json
            teacher-console/package-lock.json

      - name: Install, syntax-check, and package Creator preview
        run: |
          Push-Location creator-app
          try {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed for Creator" }
            npm audit --audit-level=high
            if ($LASTEXITCODE -ne 0) { throw "npm audit failed for Creator" }
            foreach ($file in @("main.js", "preload.js", "app/renderer.js")) {
              node --check $file
              if ($LASTEXITCODE -ne 0) { throw "Syntax check failed for Creator/$file" }
            }
            npm run package:win
            if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed for Creator" }
          } finally {
            Pop-Location
          }

      - name: Install and syntax-check School Console
        run: |
          Push-Location teacher-console
          try {
            npm ci --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed for School Console" }
            npm audit --audit-level=high
            if ($LASTEXITCODE -ne 0) { throw "npm audit failed for School Console" }
            foreach ($file in @("main.js", "preload.js", "app/renderer.js")) {
              node --check $file
              if ($LASTEXITCODE -ne 0) { throw "Syntax check failed for School Console/$file" }
            }
          } finally {
            Pop-Location
          }

      - name: Package controlled School Console
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_school_console }}
        run: |
          Push-Location teacher-console
          try {
            npm run package:win
            if ($LASTEXITCODE -ne 0) { throw "Windows packaging failed for School Console" }
          } finally {
            Pop-Location
          }

      - name: Validate and checksum Creator executable
        run: |
          $creatorAssets = @(Get-ChildItem creator-app/dist `
            -Filter "OpenClassCraft-Creator-*-windows-x64.exe" -File)
          if ($creatorAssets.Count -ne 1) {
            throw "Expected one Creator executable; found $($creatorAssets.Count)"
          }
          New-Item -ItemType Directory -Force creator-artifact | Out-Null
          $destination = Join-Path creator-artifact $creatorAssets[0].Name
          Copy-Item $creatorAssets[0].FullName $destination
          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii "$destination.sha256" "$hash  $($creatorAssets[0].Name)"

      - name: Validate and checksum controlled School Console executable
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_school_console }}
        run: |
          $teacherAssets = @(Get-ChildItem teacher-console/dist `
            -Filter "OpenClassCraft-Teacher-Console-*-windows-x64.exe" -File)
          if ($teacherAssets.Count -ne 1) {
            throw "Expected one School Console executable; found $($teacherAssets.Count)"
          }
          New-Item -ItemType Directory -Force school-console-artifact | Out-Null
          $destination = Join-Path school-console-artifact $teacherAssets[0].Name
          Copy-Item $teacherAssets[0].FullName $destination
          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii "$destination.sha256" "$hash  $($teacherAssets[0].Name)"

      - name: Upload Creator preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: OpenClassCraft-Creator-Preview-Windows-x64
          path: creator-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload controlled School Console artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_school_console }}
        uses: actions/upload-artifact@v7
        with:
          name: OpenClassCraft-School-Console-Internal-Windows-x64
          path: school-console-artifact/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Community Edition existing tag
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish && needs.fedora.result == 'success' && (inputs.release_scope != 'all-community' || (needs.ubuntu.result == 'success' && needs.windows.result == 'success')) }}
    runs-on: ubuntu-24.04
    needs: [ubuntu, fedora, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Download Ubuntu Community artifact
        if: ${{ inputs.release_scope == 'all-community' }}
        uses: actions/download-artifact@v7
        with:
          name: OpenClassCraft-Ubuntu-24.04-x86_64
          path: release-assets

      - name: Download Fedora Community artifact
        uses: actions/download-artifact@v7
        with:
          name: OpenClassCraft-Fedora-44-x86_64
          path: release-assets

      - name: Download Windows Community artifact
        if: ${{ inputs.release_scope == 'all-community' }}
        uses: actions/download-artifact@v7
        with:
          name: OpenClassCraft-Windows-x64
          path: release-assets

      - name: Verify immutable tag and public asset boundary
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ -z "$TAG" || "$TAG" == -* ]]; then
            echo 'A safe, existing release tag is required.' >&2
            exit 1
          fi
          git check-ref-format "refs/tags/$TAG"
          git show-ref --verify --quiet "refs/tags/$TAG"
          tag_commit="$(git rev-list -n 1 "refs/tags/$TAG")"
          built_commit="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$built_commit" ]]; then
            echo "Tag $TAG does not point to the built commit $built_commit." >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to replace it." >&2
            exit 1
          fi
          bash util/ci/verify_public_release_assets.sh release-assets "${{ inputs.release_scope }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          release_flags=()
          if [[ "$TAG" == *-* ]]; then
            release_flags+=(--prerelease)
          fi
          release_preamble="$(<.github/COMMUNITY_RELEASE_PREAMBLE.md)"
          gh release create "$TAG" --verify-tag \
            --title "OpenClassCraft $TAG" \
            --generate-notes \
            --notes "$release_preamble" \
            "${release_flags[@]}" \
            release-assets/*
