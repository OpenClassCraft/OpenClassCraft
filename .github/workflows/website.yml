name: website

on:
  push:
    branches: [Latest]
    paths:
      - '.github/workflows/website.yml'
      - 'website/**'
      - 'games/luanti_edu/menu/background.png'
      - 'games/luanti_edu/menu/icon.png'
  pull_request:
    paths:
      - '.github/workflows/website.yml'
      - 'website/**'
      - 'games/luanti_edu/menu/background.png'
      - 'games/luanti_edu/menu/icon.png'
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static launch site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build site
        run: bash website/build.sh

      - name: Validate generated site
        run: |
          test -s website/dist/index.html
          test -s website/dist/styles.css
          test -s website/dist/assets/background.png
          test -s website/dist/assets/icon.png
          test -f website/dist/.nojekyll
          node website/validate.mjs website/dist

      - name: Configure GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist
          include-hidden-files: true

  deploy:
    name: Deploy launch site
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
