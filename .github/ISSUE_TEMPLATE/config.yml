blank_issues_enabled: true
contact_links:
  - name: Report an OpenClassCraft security vulnerability privately
    url: https://github.com/OpenClassCraft/OpenClassCraft/security/advisories/new
    about: Do not disclose vulnerabilities, bridge tokens, or private classroom data in a public issue.
  - name: Search OpenClassCraft issues
    url: https://github.com/OpenClassCraft/OpenClassCraft/issues
    about: Check for an existing report before opening a duplicate.
  - name: Report a confirmed upstream Luanti engine issue
    url: https://github.com/luanti-org/luanti/issues/new/choose
    about: Use this only when the problem also occurs in an unmodified current Luanti build.
