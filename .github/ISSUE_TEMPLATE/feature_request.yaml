name: Feature request
description: Suggest an improvement for OpenClassCraft
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the learning, classroom, accessibility, creator, or developer problem before describing a solution. Check the current `Latest` branch, [open issues](https://github.com/OpenClassCraft/OpenClassCraft/issues), and `PROJECT_CHECKLIST.md` first.

        Do not include student records or other private classroom information. Security issues belong in [private vulnerability reporting](https://github.com/OpenClassCraft/OpenClassCraft/security/advisories/new).

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Robot programming or curriculum activity
        - Guides, boards, lessons, checkpoints, or chemistry
        - Accessibility
        - Local classroom multiplayer or permissions
        - In-game Creator Lab
        - Desktop Creator
        - Teacher Console or LAN lesson bridge
        - Ubuntu, Fedora, or Windows packaging
        - Engine or developer API
        - Documentation or community
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or learning need
      description: Who encounters the problem, in what setting, and why does it matter?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed experience
      description: Describe the user-visible workflow and a small, testable first version.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include current workarounds or a simpler solution if one exists.
    validations:
      required: false

  - type: textarea
    id: safety
    attributes:
      label: Classroom impact
      description: Consider student/educator permissions, destructive actions, privacy, offline/LAN use, accessibility, and existing-world compatibility.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Examples or supporting material
      description: Add a mockup, lesson scenario, technical reference, or related issue without private student information.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I checked that this is not already implemented or requested.
          required: true
        - label: I removed private classroom and student information.
          required: true
        - label: I disclosed material LLM/AI help used to prepare this request, or none was used.
          required: true
