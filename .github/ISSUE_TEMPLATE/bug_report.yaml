name: Bug report
description: Report a reproducible problem in OpenClassCraft
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve OpenClassCraft. Search existing issues and reproduce the problem with the latest OpenClassCraft release or `Latest` branch when practical.

        **Privacy:** remove student names, passwords, bridge tokens, private LAN addresses, and other personal data from screenshots, worlds, `debug.txt`, `minetest.conf`, CSV files, and backups. Report vulnerabilities through [private vulnerability reporting](https://github.com/OpenClassCraft/OpenClassCraft/security/advisories/new), not this form.

        If the same issue occurs in an unmodified Luanti installation, mention that below; maintainers can help route an upstream engine report.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Where is the problem most visible?
      options:
        - Robot programming or game inventory
        - Guides, boards, lessons, checkpoints, or chemistry
        - In-game Creator Lab or World Edit Wand
        - Desktop Creator
        - Teacher Console or LAN lesson bridge
        - Main menu, renderer, audio, or engine
        - Ubuntu build/package
        - Fedora build/package
        - Windows build/package
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: OpenClassCraft version or commit
      description: Use the release tag, About-screen version, or `git rev-parse --short HEAD`.
      placeholder: "Example: 0.1.0 / openclasscraft-latest / bb50208"
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Installation source
      options:
        - GitHub release archive
        - Built from source
        - Development run of Creator or Teacher Console
        - Other or unknown
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and version
      placeholder: "Example: Fedora 44 x64, Ubuntu 24.04 x64, or Windows 11 x64"
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed result and any error message.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a fresh disposable world/project when possible and provide enough detail for another person to repeat the problem.
      placeholder: |
        1. Create ...
        2. Place/open ...
        3. Select ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted logs and diagnostics
      description: Include relevant final log lines, graphics renderer/build flags, or JavaScript console output. Remove private data and secrets first.
      render: text
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, whether it worked previously, multiplayer role, world type, and whether stock Luanti reproduces it.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing OpenClassCraft issues.
          required: true
        - label: I removed student information, passwords, access tokens, and private addresses.
          required: true
        - label: I disclosed material LLM/AI help used to prepare this report, or none was used.
          required: true
