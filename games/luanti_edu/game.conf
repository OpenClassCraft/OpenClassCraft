title       = OpenClassCraft
description = An educational world for programming robots, exploring ecosystems, caring for animals, building circuits, science experiments, and classroom projects.
min_minetest_version = 5.8
textdomain = luanti_edu

# Every new OpenClassCraft world uses the same connected river-and-valley
# terrain model. Hiding alternatives prevents accidental incompatible worlds.
default_mapgen = valleys
allowed_mapgens = valleys
disallowed_mapgen_settings = seed, mg_flags, mgvalleys_spflags

# Lock these settings so no player or server operator can override them
# !enable_damage means force it to FALSE and hide the checkbox
disabled_settings = !enable_damage
