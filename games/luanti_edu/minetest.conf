mapgen_limit = 2047
mg_flags = caves,nodungeons,light,decorations,biomes,noores
mgvalleys_spflags = altitude_chill,humid_rivers,vary_river_depth,altitude_dry
mgvalleys_altitude_chill = 82
mgvalleys_river_depth = 3
mgvalleys_river_size = 5
mgvalleys_cave_width = 0.16
mgvalleys_small_cave_num_min = 0
mgvalleys_small_cave_num_max = 1
mgvalleys_large_cave_num_min = 0
mgvalleys_large_cave_num_max = 1
mgvalleys_large_cave_depth = -96
mgvalleys_large_cave_flooded = 0.72
mgvalleys_cavern_limit = -512
mgvalleys_cavern_taper = 128
mgvalleys_cavern_threshold = 0.84
mg_biome_np_heat = 50, 50, (320, 320, 320), 5349, 4, 0.55, 2.0, eased
mg_biome_np_humidity = 50, 50, (320, 320, 320), 842, 4, 0.55, 2.0, eased
